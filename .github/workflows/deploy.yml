name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=${REGISTRY}/${OWNER}/${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${OWNER}/${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.images.outputs.backend_image }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.BACKEND_URL }}/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.images.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend_image }}:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    env:
      APP_DIR: /opt/wedding-system
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}:${{ github.sha }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}:${{ github.sha }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            mkdir -p "$APP_DIR/backend"

            cat > "$APP_DIR/backend/.env" <<'EOF_BACKEND_ENV'
            PORT=5000
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            EOF_BACKEND_ENV

            cat > "$APP_DIR/docker-compose.yml" <<EOF_COMPOSE
            services:
              backend:
                image: ${BACKEND_IMAGE}
                env_file:
                  - ./backend/.env
                ports:
                  - "5000:5000"
                restart: unless-stopped

              frontend:
                image: ${FRONTEND_IMAGE}
                ports:
                  - "3000:80"
                depends_on:
                  - backend
                restart: unless-stopped
            EOF_COMPOSE

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            cd "$APP_DIR"
            docker compose pull
            docker compose up -d
            docker image prune -f
